<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>

    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   stop-color="#020A16"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <linearGradient id="a1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="25%"  stop-color="#00F0FF"/>
      <stop offset="65%"  stop-color="#00C2FF"/>
      <stop offset="100%" stop-color="#0088BB" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="a2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="45%"  stop-color="#00DDFF"/>
      <stop offset="100%" stop-color="#0077AA" stop-opacity="0.1"/>
    </linearGradient>

    <linearGradient id="a3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="55%"  stop-color="#00AADD"/>
      <stop offset="100%" stop-color="#004466" stop-opacity="0.1"/>
    </linearGradient>

    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00C2FF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="nd" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="40%"  stop-color="#00EEFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Circuit trace gradient -->
    <linearGradient id="traceH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00C2FF" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#00C2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="traceV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#00C2FF" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00C2FF" stop-opacity="0.8"/>
      <stop offset="70%"  stop-color="#00C2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00C2FF" stop-opacity="0"/>
    </linearGradient>

    <filter id="bigBloom" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="5" result="b1"/>
      <feGaussianBlur stdDeviation="10" result="b2"/>
      <feGaussianBlur stdDeviation="18" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="arcBloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="traceGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="circ">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>

  </defs>

  <g clip-path="url(#circ)">

    <!-- BG -->
    <rect width="400" height="400" fill="url(#bg)"/>
    <circle cx="200" cy="200" r="200" fill="url(#core)"/>

    <!-- ════════════════════════════════
         CIRCUIT BOARD — BOLD & VISIBLE
    ════════════════════════════════ -->

    <!-- Main horizontal traces — thick, glowing -->
    <g filter="url(#traceGlow)">
      <line x1="20"  y1="130" x2="380" y2="130"
        stroke="url(#traceH)" stroke-width="1.8" opacity="0.55"/>
      <line x1="20"  y1="200" x2="380" y2="200"
        stroke="url(#traceH)" stroke-width="1.8" opacity="0.55"/>
      <line x1="20"  y1="270" x2="380" y2="270"
        stroke="url(#traceH)" stroke-width="1.8" opacity="0.55"/>
    </g>

    <!-- Main vertical traces -->
    <g filter="url(#traceGlow)">
      <line x1="130" y1="20"  x2="130" y2="380"
        stroke="url(#traceV)" stroke-width="1.8" opacity="0.55"/>
      <line x1="200" y1="20"  x2="200" y2="380"
        stroke="url(#traceV)" stroke-width="1.8" opacity="0.55"/>
      <line x1="270" y1="20"  x2="270" y2="380"
        stroke="url(#traceV)" stroke-width="1.8" opacity="0.55"/>
    </g>

    <!-- L-shaped circuit connectors — bold -->
    <g stroke="#00C2FF" stroke-width="1.5" fill="none" opacity="0.45" filter="url(#traceGlow)">
      <!-- Top left -->
      <path d="M 60,130 L 60,80 L 130,80"/>
      <!-- Top right -->
      <path d="M 270,80 L 340,80 L 340,130"/>
      <!-- Bottom left -->
      <path d="M 60,270 L 60,320 L 130,320"/>
      <!-- Bottom right -->
      <path d="M 340,270 L 340,320 L 270,320"/>
      <!-- Center connectors -->
      <path d="M 130,200 L 90,200 L 90,130"/>
      <path d="M 270,200 L 310,200 L 310,270"/>
      <path d="M 200,130 L 200,90 L 270,90"/>
      <path d="M 200,270 L 200,310 L 130,310"/>
    </g>

    <!-- Grid intersection nodes — large squares, bright -->
    <g filter="url(#traceGlow)">
      <!-- Main intersections -->
      <rect x="124" y="124" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="194" y="124" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="264" y="124" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="124" y="194" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="264" y="194" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="124" y="264" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="194" y="264" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <rect x="264" y="264" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.7"/>
      <!-- Center -->
      <rect x="194" y="194" width="12" height="12" rx="2" fill="#00C2FF" opacity="0.5"/>

      <!-- Corner circuit endpoints — extra bright -->
      <rect x="54"  y="74"  width="12" height="12" rx="2" fill="#00F0FF" opacity="0.8"/>
      <rect x="334" y="74"  width="12" height="12" rx="2" fill="#00F0FF" opacity="0.8"/>
      <rect x="54"  y="314" width="12" height="12" rx="2" fill="#00F0FF" opacity="0.8"/>
      <rect x="334" y="314" width="12" height="12" rx="2" fill="#00F0FF" opacity="0.8"/>

      <!-- Mid-point extras -->
      <rect x="84"  y="124" width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="84"  y="194" width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="308" y="194" width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="194" y="84"  width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="264" y="84"  width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="124" y="304" width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
      <rect x="194" y="304" width="8" height="8" rx="1.5" fill="#00C2FF" opacity="0.5"/>
    </g>

    <!-- ════════════════════════════════
         MAIN ARC MARK — BOLD
    ════════════════════════════════ -->

    <!-- Arc 1 — LARGE (210°) -->
    <path d="M 261.9,288.4 A 108,108 0 1,1 190.6,92.4"
      fill="none" stroke="#00C2FF" stroke-width="70"
      stroke-linecap="round" opacity="0.08"
      filter="url(#arcBloom)"/>
    <path d="M 261.9,288.4 A 108,108 0 1,1 190.6,92.4"
      fill="none" stroke="#00C2FF" stroke-width="38"
      stroke-linecap="round" opacity="0.18"/>
    <path d="M 261.9,288.4 A 108,108 0 1,1 190.6,92.4"
      fill="none" stroke="url(#a1)" stroke-width="28"
      stroke-linecap="round"/>
    <path d="M 261.9,288.4 A 108,108 0 1,1 190.6,92.4"
      fill="none" stroke="#FFFFFF" stroke-width="3.5"
      stroke-linecap="round" opacity="0.3"/>

    <!-- Arc 2 — MEDIUM (80°) -->
    <path d="M 215.1,93.1 A 108,108 0 0,1 307.9,196.2"
      fill="none" stroke="#00C2FF" stroke-width="50"
      stroke-linecap="round" opacity="0.1"
      filter="url(#arcBloom)"/>
    <path d="M 215.1,93.1 A 108,108 0 0,1 307.9,196.2"
      fill="none" stroke="#00C2FF" stroke-width="26"
      stroke-linecap="round" opacity="0.2"/>
    <path d="M 215.1,93.1 A 108,108 0 0,1 307.9,196.2"
      fill="none" stroke="url(#a2)" stroke-width="22"
      stroke-linecap="round"/>
    <path d="M 215.1,93.1 A 108,108 0 0,1 307.9,196.2"
      fill="none" stroke="#FFFFFF" stroke-width="3"
      stroke-linecap="round" opacity="0.28"/>

    <!-- Arc 3 — SMALL (38°) -->
    <path d="M 306.4,218.8 A 108,108 0 0,1 272.3,280.2"
      fill="none" stroke="#00C2FF" stroke-width="38"
      stroke-linecap="round" opacity="0.08"
      filter="url(#arcBloom)"/>
    <path d="M 306.4,218.8 A 108,108 0 0,1 272.3,280.2"
      fill="none" stroke="#00C2FF" stroke-width="20"
      stroke-linecap="round" opacity="0.18"/>
    <path d="M 306.4,218.8 A 108,108 0 0,1 272.3,280.2"
      fill="none" stroke="url(#a3)" stroke-width="17"
      stroke-linecap="round"/>

    <!-- ════════════════════════════════
         ARC NODES — BIG & PUNCHY
    ════════════════════════════════ -->

    <!-- Arc 1 tip A — (261.9, 288.4) -->
    <!-- Square frame on node — tech feel -->
    <rect x="247" y="273.5" width="30" height="30" rx="4"
      fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.5"
      filter="url(#traceGlow)"/>
    <circle cx="261.9" cy="288.4" r="44" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.4"/>
    <circle cx="261.9" cy="288.4" r="16" fill="#FFFFFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="261.9" cy="288.4" r="8"  fill="#FFFFFF"/>

    <!-- Arc 1 tip B — (190.6, 92.4) -->
    <rect x="176" y="78" width="30" height="30" rx="4"
      fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.5"
      filter="url(#traceGlow)"/>
    <circle cx="190.6" cy="92.4" r="38" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.38"/>
    <circle cx="190.6" cy="92.4" r="13" fill="#FFFFFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="190.6" cy="92.4" r="7"  fill="#FFFFFF"/>

    <!-- Arc 2 tip A — (215.1, 93.1) -->
    <rect x="203" y="81" width="24" height="24" rx="3"
      fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.5"
      filter="url(#traceGlow)"/>
    <circle cx="215.1" cy="93.1" r="28" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.35"/>
    <circle cx="215.1" cy="93.1" r="10" fill="#AAEEFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="215.1" cy="93.1" r="5"  fill="#FFFFFF"/>

    <!-- Arc 2 tip B — (307.9, 196.2) -->
    <rect x="296" y="184" width="24" height="24" rx="3"
      fill="none" stroke="#00C2FF" stroke-width="1.5" opacity="0.5"
      filter="url(#traceGlow)"/>
    <circle cx="307.9" cy="196.2" r="28" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.34"/>
    <circle cx="307.9" cy="196.2" r="10" fill="#88DDFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="307.9" cy="196.2" r="5"  fill="#FFFFFF"/>

    <!-- Arc 3 tip A — (306.4, 218.8) -->
    <rect x="298" y="210.8" width="17" height="17" rx="2.5"
      fill="none" stroke="#00C2FF" stroke-width="1.2" opacity="0.45"
      filter="url(#traceGlow)"/>
    <circle cx="306.4" cy="218.8" r="20" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.3"/>
    <circle cx="306.4" cy="218.8" r="7"  fill="#66CCFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="306.4" cy="218.8" r="3.5" fill="#FFFFFF" opacity="0.9"/>

    <!-- Arc 3 tip B — (272.3, 280.2) -->
    <rect x="265" y="273" width="15" height="15" rx="2"
      fill="none" stroke="#00C2FF" stroke-width="1" opacity="0.4"
      filter="url(#traceGlow)"/>
    <circle cx="272.3" cy="280.2" r="18" fill="url(#nd)"
      filter="url(#bigBloom)" opacity="0.28"/>
    <circle cx="272.3" cy="280.2" r="6"  fill="#55BBFF" opacity="0.7" filter="url(#glow)"/>
    <circle cx="272.3" cy="280.2" r="3"  fill="#FFFFFF" opacity="0.85"/>

    <!-- Outer ring -->
    <circle cx="200" cy="200" r="186"
      fill="none" stroke="#00C2FF" stroke-width="1" opacity="0.1"/>

  </g>
</svg>
